<!-- @dsCard height=300 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Token Explorer</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:-40px; right:24px; width:380px; height:380px; color:var(--ink); }
  .art .chosen { stroke:var(--accent); }
  .words { position:absolute; left:var(--space-32); bottom:var(--space-32); max-width:460px; }
  .name { margin:0; font:700 76px/.95 var(--font-sans); letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-12) 0 0 4px; font:15px/22px var(--font-sans); color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<!-- the product mark at cover scale: the answer path forks, the model takes one branch (accent), the faded ones are what it could have said -->
<svg class="art" viewBox="170 170 700 700" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M512 512C463 458 407 401 343 359C296 328 252 315 210 315" stroke="currentColor" stroke-width="42" opacity=".42"/>
  <path d="M512 512C572 553 626 600 684 643C731 677 779 692 823 695" stroke="currentColor" stroke-width="42" opacity=".22"/>
  <path class="chosen" d="M512 850V512C565 446 652 431 717 372C768 326 794 277 820 225" stroke-width="76"/>
  <circle cx="512" cy="512" r="23" fill="currentColor"/>
</svg>
<div class="words">
<h1 class="name">Token Explorer</h1>
<p class="tag">Language Model · Decision Model</p>
</div>
</div>
</body>
</html>
